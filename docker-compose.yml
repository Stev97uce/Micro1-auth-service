version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - authnet

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    networks:
      - authnet

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - authnet

volumes:
  postgres_data:

networks:
  authnet:
    driver: bridge
